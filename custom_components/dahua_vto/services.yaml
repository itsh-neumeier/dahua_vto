learn_card:
  name: Karte anlernen
  description: >
    Aktiviert den Karten-Lernmodus. Sobald eine RFID-/IC-Karte an den Leser
    gehalten wird, feuert Home Assistant das Ereignis 'dahua_vto_card_learned'
    mit der Kartennummer. Optional kann die Karte direkt einem Nutzer zugeordnet
    und auf dem Gerät gespeichert werden.
  fields:
    entry_id:
      name: Geräte-ID
      description: Config-Entry-ID (optional, wenn nur ein Gerät vorhanden).
      required: false
      selector:
        text:
    user_id:
      name: Nutzer-ID
      description: >
        Numerische ID des Nutzers (z. B. "101"). Wenn angegeben, wird die Karte
        nach dem Einlesen automatisch diesem Nutzer auf dem Gerät zugewiesen.
      required: false
      selector:
        text:
    user_name:
      name: Nutzername
      description: >
        Anzeigename des Nutzers (z. B. "Max Mustermann"). Wird ein neuer Nutzer
        angelegt, wenn die Nutzer-ID noch nicht vorhanden ist.
      required: false
      selector:
        text:
    timeout:
      name: Timeout (Sekunden)
      description: Nach dieser Zeit wird der Lernmodus automatisch beendet.
      required: false
      default: 30
      selector:
        number:
          min: 10
          max: 120
          step: 5
          unit_of_measurement: s

stop_learn_card:
  name: Karten-Lernmodus beenden
  description: Bricht den laufenden Karten-Lernmodus vorzeitig ab.
  fields:
    entry_id:
      name: Geräte-ID
      description: Config-Entry-ID (optional).
      required: false
      selector:
        text:

add_card:
  name: Karte manuell hinzufügen
  description: >
    Registriert eine RFID-/IC-Karte direkt mit bekannter Kartennummer –
    ohne physisches Einlesen.
  fields:
    entry_id:
      name: Geräte-ID
      description: Config-Entry-ID (optional).
      required: false
      selector:
        text:
    card_no:
      name: Kartennummer
      description: Die hexadezimale Kartennummer (z. B. "1A2B3C4D").
      required: true
      selector:
        text:
    user_id:
      name: Nutzer-ID
      description: Numerische Nutzer-ID, der die Karte zugeordnet wird.
      required: true
      selector:
        text:
    user_name:
      name: Nutzername
      description: Optional – legt den Nutzer an, falls er noch nicht existiert.
      required: false
      selector:
        text:

delete_card:
  name: Karte löschen
  description: Entfernt eine registrierte RFID-/IC-Karte vom Gerät.
  fields:
    entry_id:
      name: Geräte-ID
      description: Config-Entry-ID (optional).
      required: false
      selector:
        text:
    card_no:
      name: Kartennummer
      description: Die zu löschende Kartennummer.
      required: true
      selector:
        text:

enroll_fingerprint:
  name: Fingerabdruck anlernen
  description: >
    Startet den Fingerabdruck-Einlern-Modus auf dem Gerät. Das Display der
    Türstation fordert den Nutzer auf, den Finger ca. 3× aufzulegen.
    Nach Abschluss feuert HA das Ereignis 'dahua_vto_fingerprint_enrolled'
    (Erfolg) oder 'dahua_vto_fingerprint_failed' (Fehler/Timeout).
  fields:
    entry_id:
      name: Geräte-ID
      description: Config-Entry-ID (optional).
      required: false
      selector:
        text:
    user_id:
      name: Nutzer-ID
      description: Numerische ID des Nutzers (z. B. "101").
      required: true
      selector:
        text:
    user_name:
      name: Nutzername
      description: Optionaler Name – legt den Nutzer auf dem Gerät an, wenn nötig.
      required: false
      default: ""
      selector:
        text:
    finger_index:
      name: Finger-Index
      description: >
        Welcher Finger angelegt wird (0 = rechter Zeigefinger, 1–9 = weitere
        Finger). Standard: 0.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 9
          step: 1
    timeout:
      name: Timeout (Sekunden)
      description: >
        Maximale Wartezeit auf den Abschluss des Einlernens. Nach Ablauf
        wird der Vorgang abgebrochen.
      required: false
      default: 60
      selector:
        number:
          min: 20
          max: 180
          step: 10
          unit_of_measurement: s

cancel_enrollment:
  name: Einlern-Vorgang abbrechen
  description: Bricht einen laufenden Fingerabdruck-Einlern-Vorgang ab.
  fields:
    entry_id:
      name: Geräte-ID
      description: Config-Entry-ID (optional).
      required: false
      selector:
        text:

list_users:
  name: Benutzer auslesen
  description: >
    Liest alle registrierten Benutzer vom Gerät aus und feuert das HA-Ereignis
    'dahua_vto_users_listed' mit einer Liste aller Benutzer (UserID, Name usw.).
    Nützlich zur Diagnose oder als Grundlage für Automationen.
  fields:
    entry_id:
      name: Geräte-ID
      description: Config-Entry-ID (optional, wenn nur ein Gerät vorhanden).
      required: false
      selector:
        text:

call_room:
  name: Anruf starten
  description: >
    Startet einen Video-Anruf zur angegebenen VTH-Innenstation (Raumnummer).
    Feuert keinen eigenen HA-Event – der aktive Anruf wird über den
    'Im Gespräch'-Sensor sichtbar.
  fields:
    entry_id:
      name: Geräte-ID
      description: Config-Entry-ID (optional).
      required: false
      selector:
        text:
    room_no:
      name: Raumnummer
      description: >
        VTH-Raumnummer, die angerufen werden soll (z. B. "8020").
        Die Raumnummern sind in der Gerätekonfiguration hinterlegt.
      required: true
      selector:
        text:

stop_call:
  name: Anruf beenden
  description: >
    Beendet einen laufenden Video-Anruf. Optional kann die Raumnummer der
    Innenstation angegeben werden.
  fields:
    entry_id:
      name: Geräte-ID
      description: Config-Entry-ID (optional).
      required: false
      selector:
        text:
    room_no:
      name: Raumnummer (optional)
      description: VTH-Raumnummer (optional – ohne Angabe wird der aktive Anruf beendet).
      required: false
      selector:
        text:

trigger_alarm:
  name: Alarm schalten
  description: >
    Schaltet einen Alarmausgang-Kanal ein oder aus. Optional kann eine
    Dauer angegeben werden – nach Ablauf wird der Alarm automatisch gestoppt.
  fields:
    entry_id:
      name: Geräte-ID
      description: Config-Entry-ID (optional).
      required: false
      selector:
        text:
    channel:
      name: Kanal
      description: Alarmausgang-Kanal (Standard: 1).
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 8
          step: 1
    active:
      name: Aktiv
      description: "true = Alarm ein, false = Alarm aus (Standard: true)."
      required: false
      default: true
      selector:
        boolean:
    duration:
      name: Dauer (Sekunden)
      description: >
        Automatisch stoppen nach dieser Zeit (0 = kein Auto-Stop, Standard: 0).
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 3600
          step: 5
          unit_of_measurement: s

get_logs:
  name: Ereignisprotokoll abrufen
  description: >
    Gibt die letzten Ereignisse aus. Feuert das HA-Ereignis
    'dahua_vto_logs_fetched' mit allen Einträgen. Quellen: 'device' (Gerät
    via RPC2), 'memory' (HA-interner Puffer) oder 'both' (beide, Standard).
    Protokolltypen: 'access' (Türöffnungen/Karten), 'call' (Videoanruf-Log),
    'all' (beide).
  fields:
    entry_id:
      name: Geräte-ID
      description: Config-Entry-ID (optional).
      required: false
      selector:
        text:
    count:
      name: Anzahl Einträge
      description: Maximale Anzahl zurückgegebener Log-Einträge (Standard: 20).
      required: false
      default: 20
      selector:
        number:
          min: 1
          max: 100
          step: 1
    source:
      name: Quelle
      description: "'device', 'memory' oder 'both' (Standard: both)."
      required: false
      default: both
      selector:
        select:
          options:
            - device
            - memory
            - both
    log_type:
      name: Protokolltyp
      description: >
        'access' = Türöffnungen & Kartenzugänge (AccessControlCardRec, Standard),
        'call' = Videoanruf-Protokoll (VideoTalkLog),
        'all' = beide kombiniert.
      required: false
      default: access
      selector:
        select:
          options:
            - access
            - call
            - all
